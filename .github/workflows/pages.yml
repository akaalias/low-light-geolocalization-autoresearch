name: pages

# Publishes the research gallery to GitHub Pages after every push (the loop
# pushes one commit per experiment, so the live site tracks the research).
#
# Parity contract: the site is assembled by infra/build_site.sh — the same
# script used for local preview — so a locally-verified page is exactly what
# deploys. See docs/infra.md "Publishing".
#
# Dormant until the repo variable PAGES_ENABLED is set to 'true' (do this
# when the repo goes public and Pages is switched to "GitHub Actions").
# The build job always runs as a render smoke-test; only deploy is gated.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  # queue, don't cancel: with the slimmed ~64MB artifact builds take ~3 min,
  # and cancel-in-progress kept killing deploys seconds before completion
  # whenever the loop pushed mid-build
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ubuntu-latest ships ~30GB of preinstalled toolchains this job never
      # touches (dotnet, Android SDK, GHC); a checkout has run the runner out
      # of disk before (run 29933088894), so reclaim headroom first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      # NO Git LFS. This job used to `git lfs pull` ~1.8 GB of experiment
      # binaries to build a site whose entire image payload is ~9 MB, and on
      # 2026-07-31 the account's LFS budget ran out and every deploy failed at
      # that step (run 30632545136) with nothing wrong with the site itself.
      #
      # The images the pages actually reference are now frozen into
      # site_assets/ as ordinary git objects by infra/freeze_site_assets.py,
      # so publishing no longer depends on a binary quota at all. LFS pointers
      # for everything else stay unhydrated here, which is fine: build_site.sh
      # never opens them.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify the site's images are present without LFS
        run: |
          test -f site_assets/manifest.json || {
            echo "site_assets/manifest.json missing — run infra/freeze_site_assets.py"
            echo "on a checkout with LFS hydrated and commit the result."; exit 1; }
          python3 - <<'EOF'
          import json, pathlib
          m = json.loads(pathlib.Path("site_assets/manifest.json").read_text())
          missing = [n for n in set(m.values())
                     if not (pathlib.Path("site_assets") / n).exists()]
          assert not missing, f"site_assets missing {len(missing)} file(s): {missing[:5]}"
          print(f"{len(m)} references -> {len(set(m.values()))} files, all present")
          EOF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: pip install --quiet numpy pillow pyyaml
      - name: Assemble site (same script as local preview)
        run: PY=python3 infra/build_site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # the site artifact is hundreds of MB of experiment figures;
          # deployments can exceed the 10-min default
          timeout: 1800000
          error_count: 15
